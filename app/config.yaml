# Paths are relative to the working directory; launch from the repository root.
camera:
  width: 640
  height: 480
  fps: 15
  frame_timeout_s: 2.0
model:
  path: models/pigeon_baseline_v1-2/best_ncnn_model
  image_size: 640
  confidence: 0.5
display:
  enabled: true
output:
  directory: outputs
  record: false
  recording_fps: 15
  health_interval_s: 30
