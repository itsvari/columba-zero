# Paths are relative to the working directory; launch from the repository root.
camera:
  width: 800
  height: 450
  fps: 30
  frame_timeout_s: 2.0
  stream: lores            # main | lores (hardware-scaled full field of view, e.g. 640x360)
  main_size: null         # lores only: [width, height] of the main stream; null picks a binned mode
  lens_position: null     # dioptres for manual focus (0 = infinity); null keeps autofocus
  max_exposure_us: null   # cap automatic exposure, e.g. 16666 for 1/60 s
  tuning_file: null       # e.g. imx708_noir.json for the NoIR camera
  camera_index: 0
  name: null              # logged as frame.camera; null means camera<index>
model:
  path: models/yolo26n-v2s-800-round2-plain-seed1-yolo11-fp16
  image_size: [448, 800]         # integer (square) or [height, width], e.g. [384, 640]
  confidence: 0.62646484375
  backend: native    # ultralytics | native (columba_native C++ detector)
  threads: 4              # native backend CPU threads
display:
  enabled: true
output:
  directory: outputs
  record: false
  recording_fps: 15
  health_interval_s: 30
# Per-track k-of-n trigger confirmation; off keeps per-frame detections only.
confirmation:
  enabled: true
  k: 2
  n: 3
  iou: 0.3
  max_age_frames: 2
# Day/night switching is off unless a cameras list is given: exactly one day and
# one night camera; unset values inherit from camera:. Only one camera is open.
# cameras:
#   - {name: wide, role: day, camera_index: 0}
#   - {name: noir, role: night, camera_index: 1, tuning_file: imx708_noir.json, max_exposure_us: 16666}
