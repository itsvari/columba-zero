# Training data v2 (PLAN.md 5.1, WS2 task 6), `single` taxonomy. Reviewed sources only:
# human boxes (Roboflow, COCO), reviewed YOLO11x pseudo boxes (iNaturalist, see
# data_sources/review/*.summary.json), per-image reviews for COCO birds and NEA.
# Val follows columba-test-v2's image-kind mix so the operating threshold is chosen with
# empty and confuser images present (coordinator decision, 2026-10-14).
name: columba-train-v2
kind: train
taxonomy: single
test_dataset: columba-test-v2
sources:
  - {name: roboflow-yolo1199, require_boxes: true}
  - name: roboflow-nea                     # training only; stretched 416x416 images
    require_boxes: true
    train_only: true
    image_review: data_sources/review/roboflow-nea.images.jsonl
    review_default: keep
  - name: coco-birds                       # val2017 birds; pigeons only if reviewed as such
    image_review: data_sources/review/coco-birds.images.jsonl
  - name: coco-birds-train
    image_review: data_sources/review/coco-birds-train.images.jsonl
  - {name: inat-pigeon, labels: auto, max_images: 2500, prefer: small_birds}
  - {name: inat-species, labels: auto}
  - {name: inat-other, labels: auto}
  - name: coco-negatives-train             # YOLO11x bird check on all 2300 (2 dropped) + 94-image visual sample
    image_review: data_sources/review/coco-negatives-train.images.jsonl
    review_default: keep
phash_max_distance: 10
test_exclusion_distance: 12
# A 64-bit phash link also needs the 256-bit phashes within 32 bits: iNaturalist close-ups on
# sky or blurred foliage collide at 64 bits and chained 848 unrelated images into one group.
# Test exclusion (above) stays 64-bit only, which is the conservative direction.
phash256_confirm_distance: 32
val_fraction: 0.15                         # of pigeon-positive images
val_mix: {pigeon: 0.45, other_bird: 0.2, empty: 0.35}
seed: 0
label_conventions: >-
  single taxonomy: only feral pigeons are boxed (class 0). COCO bird images are pigeons
  only where reviewed as feral pigeons; other birds are unboxed background and listed in
  classes_present (species name or other_bird). iNaturalist boxes are YOLO11x `bird` boxes
  (pseudo_reviewed) with the observation's species. COCO train2017 street scenes are empty.
notes: >-
  Same leakage rules as columba-train-v1clean: groups join SHA-256 copies, mirror-aware phash
  neighbours (<= 10), Roboflow copies and capture sessions, iNaturalist observations; any group
  with a columba-test-v2 image and any image within phash 12 of a test image is dropped.
