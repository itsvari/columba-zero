attribution: "nea-pn0bc, \"pigeon+foxes detector\" v1, Roboflow Universe, CC BY 4.0, https://universe.roboflow.com/nea-pn0bc/pigeon-foxes-detector"
classes:            # source class name -> our class name; unmapped classes are dropped
  pigeon: pigeon
  Fox: null
