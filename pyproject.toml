[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "columba-zero"
version = "0.2.0"
description = "Detection-only Raspberry Pi 5 pigeon camera prototype"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24,<3",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
vision = ["opencv-python>=4.6", "ultralytics==8.4.175", "ncnn==1.0.20260526"]
metrics = ["psutil>=5.9"]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11", "types-PyYAML", "types-psutil"]

[project.scripts]
columba-zero = "app.main:cli"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]


[tool.mypy]
python_version = "3.11"
strict = true
explicit_package_bases = true
files = ["app", "tests", "tools"]

[[tool.mypy.overrides]]
module = ["ultralytics", "ultralytics.*", "picamera2", "libcamera"]
follow_imports = "skip"
ignore_missing_imports = true
