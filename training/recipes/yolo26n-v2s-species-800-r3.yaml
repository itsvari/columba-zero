id: yolo26n-v2s-species-800-r3
framework: ultralytics
base_model: yolo26n.pt
dataset: columba-train-v2s-species
taxonomy: species
seeds:
- 0
- 1
- 2
lane: nv
gpu_constraint: null
est_gpu_hours: 8.0
teacher: null
train:
  epochs: 300
  patience: 50
  imgsz: 800
  nbs: 64
  cos_lr: true
  close_mosaic: 15
  cache: ram
  workers: 6
  save_period: 5
  plots: false
  optimizer: MuSGD
  lr0: 0.01
  momentum: 0.9
  warmup_bias_lr: 0.0
deploy_sizes:
- - 352
  - 608
- - 384
  - 640
- - 448
  - 800
notes: 'WS5 round 3 (PLAN 5.4 species gate), started early by coordinator decision (15 Oct):
  6 of 8 GPU slots idle and the single arm yolo26n-v2s-800-round2-plain has 3 DONE seeds.
  Identical to that arm except dataset columba-train-v2s-species / taxonomy species (the same
  images; single used the species images as unlabelled negatives). Submitted on Titan V (nv
  pool, keeps heavy slots for distillation) with batch_override 16: nbs 64 -> accumulate 4
  = effective batch 64 and weight-decay scaling identical to the single arm (batch 64 x 1
  on H100/A100); only the per-step BatchNorm batch differs. Test runs on columba-test-v2 with
  staged names aligned single -> species (pigeon index 0, labels unchanged), so pigeon metrics
  and FAR are comparable. No species teacher.'
batch_override: 16
