id: yolo26x-v2s-960-teacher
framework: ultralytics
base_model: yolo26x.pt
dataset: columba-train-v2s
taxonomy: single
seeds:
- 0
lane: nv
gpu_constraint: titanrtx
est_gpu_hours: 90.0
teacher: null
train:
  epochs: 300
  patience: 50
  imgsz: 960
  nbs: 64
  cos_lr: true
  close_mosaic: 15
  cache: false
  workers: 6
  save_period: 5
  plots: false
deploy_sizes:
- - 352
  - 608
- - 384
  - 640
- - 448
  - 800
notes: 'WS5 teacher for distillation and auto-labelling: 1 seed, 960, single taxonomy. Titan
  RTX because yolo26x needs more memory per sample (batch 4 used 10.4 GiB on a Titan V). batch_override
  6 from probe 945775 (measured on Titan V, 960, AMP, v1clean: yolo11x 2.1 GiB/sample, yolo26x
  2.6 GiB/sample; batch 6 OOMs on 12 GB); expected peak ≈ 15.8 GiB of 23.6 GiB (extrapolated,
  2.6 GiB/sample). nbs 64 -> accumulate 11. est_gpu_hours assumes v2s 15,865 train images
  at ~16-18 img/s (>72 h: one resubmission resumes from last.pt). cache false: a 960 RAM cache
  of v2s needs up to ~44 GB of the 64 GB job limit; GPU-bound anyway. Not a deploy candidate.'
batch_override: 6
