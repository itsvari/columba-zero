notes: 'WS5 teacher (distillation, auto-labelling): 1 seed, 960, single taxonomy, H100 family
  (gpu-long; h100-47 MIG 3g.47gb has 46.4 GB). Supersedes yolo26x-v2s-960-teacher (job 945885,
  cancelled at epoch 4 on an nv GPU at batch 6): a changed batch_override changes the recipe
  hash, which run_job rejects for an existing run, so this is a fresh run under a new id.
  batch 12 from probe 945775 (2.6 GiB/sample at 960, AMP): ~31.2 GiB peak, about 72% of 43.2
  GiB. nbs 64 -> accumulate 5. cache false (a 960 RAM cache of v2s needs up to ~44 GB of the
  64 GB job limit). est_gpu_hours assumes ~2.5x Titan V speed (Titan V measured 946 s/epoch
  at batch 4 for yolo11x) and 300 epochs. Not a deploy candidate.'
batch_override: 12
