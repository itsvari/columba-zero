id: baseline-repro
framework: ultralytics
base_model: yolo11n.pt
dataset: columba-train-v1clean
taxonomy: single
seeds:
- 0
- 1
- 2
lane: nv
gpu_constraint: null
seed_gpu_constraints:
  0: t4
  1: titanrtx
  2: titanv
est_gpu_hours: 3
teacher: null
train:
  epochs: 200
  time: null
  patience: 10
  imgsz: 640
  save: true
  save_period: 5
  cache: ram
  workers: 6
  exist_ok: false
  pretrained: true
  cls_remap: true
  optimizer: auto
  verbose: true
  deterministic: true
  single_cls: false
  rect: false
  cos_lr: false
  close_mosaic: 10
  amp: true
  fraction: 1.0
  profile: false
  freeze: null
  multi_scale: 0.0
  compile: false
  channels_last: null
  overlap_mask: true
  mask_ratio: 4
  dropout: 0.0
  val: true
  split: val
  save_json: false
  conf: null
  iou: 0.7
  max_det: 300
  quantize: null
  dnn: false
  plots: true
  nms: null
  augment: false
  agnostic_nms: false
  classes: null
  retina_masks: false
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3.0
  warmup_momentum: 0.8
  warmup_bias_lr: 0.1
  dis: 6.0
  box: 7.5
  cls: 0.5
  cls_pw: 0.0
  dfl: 1.5
  pose: 12.0
  kobj: 1.0
  rle: 1.0
  angle: 1.0
  dlog: 1.0
  dgrad: 0.5
  dlam: 1.0
  nbs: 64
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 0.0
  translate: 0.1
  scale: 0.5
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  bgr: 0.0
  mosaic: 1.0
  mixup: 0.0
  cutmix: 0.0
  copy_paste: 0.0
  copy_paste_mode: flip
  auto_augment: randaugment
  erasing: 0.4
deploy_sizes:
- - 352
  - 608
- - 384
  - 640
- - 448
  - 800
notes: >-
  v1-2 args preserved except runner-owned paths, seed, batch, device, resume and
  periodic checkpoints. Source epoch budget 200, patience 10, imgsz 640.
  Deviations from v1-2 (WS5): workers 0 -> 6 and cache false -> ram (data
  loading only; ~1.3 GB RAM of 64 GB; Ultralytics warns ram cache can make
  deterministic runs non-bit-exact, which cross-GPU seeds already are). Batch 8
  -> runner memory class (T4 48, Titan RTX 64, Titan V 32). nbs 64 gives
  accumulate round(64/batch): effective batch 64 on Titan RTX/V as in v1-2,
  but 48 on T4 (accumulate 1, weight decay scaled by 48/64). BatchNorm sees
  larger batches than v1-2. Optimizer auto still picks AdamW (2800 < 10000
  iterations). Data is
  columba-train-v1clean (868/156, regrouped, test-v2 groups removed), not the
  original v1 split.
